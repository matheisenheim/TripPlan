<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F1EA" />
    <!-- PWA installable (Chrome mobile : « Installer l'application ») -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- GitHub Pages sert le HTML avec un cache de 10 min : un index.html trop vieux
         référence des assets hashés supprimés au déploiement suivant → page blanche.
         On force la revalidation du document à chaque chargement. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TripPlan</title>
    <script>
      // Affiche les vraies erreurs JS à l'écran au lieu d'une page blanche (debug
      // mobile, où la console n'est pas accessible). Les simples erreurs de
      // chargement de ressources (event 'error' sur une balise, message vide,
      // "undefined:0:0") partent en console sans bandeau : elles ne plantent pas l'app.
      function showJsError(label, detail) {
        var pre = document.createElement('pre')
        pre.style.cssText =
          'position:fixed;inset:0;z-index:9999;margin:0;background:#fff;color:#c00;padding:1em;overflow:auto;font:12px/1.4 monospace;white-space:pre-wrap'
        pre.textContent = label + ': ' + detail
        document.body.appendChild(pre)
      }
      window.addEventListener(
        'error',
        function (e) {
          if (e.target && e.target !== window) {
            // Ressource (script/img/link) qui n'a pas chargé : bandeau discret en
            // bas avec l'URL — utile pour diagnostiquer un asset 404 (cache HTML périmé).
            var url = e.target.src || e.target.href || e.target.currentSrc || '(inconnu)'
            var bar = document.createElement('pre')
            bar.style.cssText =
              'position:fixed;left:0;right:0;bottom:0;z-index:9999;margin:0;background:#ffe9a8;color:#7a5b00;padding:0.4em 0.8em;font:11px/1.3 monospace;white-space:pre-wrap'
            bar.textContent = 'Ressource introuvable : ' + url
            document.body.appendChild(bar)
            console.error('Ressource en erreur:', url)
            return
          }
          var err = e.error
          showJsError(
            'Erreur JS',
            (e.message || String(err)) +
              '\n' +
              (e.filename || '') +
              ':' +
              (e.lineno || 0) +
              ':' +
              (e.colno || 0) +
              (err && err.stack ? '\n' + err.stack : ''),
          )
        },
        true,
      )
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason
        showJsError('Rejection', String((r && (r.stack || r.message)) || r))
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Visible tant que le JS n'a pas démarré ; retiré par main.tsx au montage. -->
    <p id="boot-hint" style="font: 14px sans-serif; color: #666; padding: 1em">Chargement de TripPlan…</p>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
